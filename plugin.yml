name: HypixelPit
main: com.marielooo.hypixelpit.HypixelPit
version: 0.3.0
api-version: 1.8
commands:
  pitstats:
    description: Displays a player's Pit stats.
    usage: /pitstats [player]
  prestige:
    description: Prestiges a player at level 120.
    usage: /prestige
  pithelp:
    description: Shows the command help menu.
    usage: /pithelp
  renownshop:
    description: Lists Renown shop options.
    usage: /renownshop
  passive:
    description: View current passive upgrades.
    usage: /passive
  mystic:
    description: Shows the Mystic item status.
    usage: /mystic
